<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElixirTrade - Login</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
    }
    .text-center {
      text-align: center;
    }
    .error-msg {
      color: var(--color-danger);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container animate-fade-in">
    <div class="glass-panel">
      <h2 class="text-center" style="font-size: 2.5rem; margin-bottom: 0.5rem; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Welcome Back</h2>
      <p class="text-center" style="color: var(--text-muted); margin-bottom: 2rem;">Log in to access your portal</p>

      <div id="errorMsg" class="error-msg">Invalid credentials. Please try again.</div>

      <form id="loginForm">
        <div class="grid" style="gap: 1.5rem;">
          <div>
            <label>Email Address</label>
            <input type="email" id="email" required placeholder="user@example.com">
          </div>
          <div>
            <label>Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%">Authenticate</button>
        </div>
      </form>

      <div class="text-center" style="margin-top: 2rem; font-size: 0.875rem; color: var(--text-muted)">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      const user = window.db.getCurrentUser();
      if(user) {
        window.location.href = 'index.html';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      const user = window.db.login(email, pass);
      if (user) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });
  </script>
</body>
</html>
