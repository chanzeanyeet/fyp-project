<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElixirTrade - Manage Product</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .form-container {
      max-width: 600px;
      margin: 4rem auto;
    }
  </style>
</head>
<body>

  <nav>
    <div class="container flex justify-between items-center">
      <a href="../index.html" class="nav-brand" style="background: var(--gradient-accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ElixirTrade | Seller</a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline">Back to Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container form-container animate-fade-in">
    <div class="glass-panel">
      <h2 style="margin-bottom: 2rem;">Add New Product</h2>
      <form id="productForm">
        <div class="grid" style="gap: 1.5rem">
          <div>
            <label>Product Name</label>
            <input type="text" id="pName" required placeholder="e.g. Plasma Blaster">
          </div>
          
          <div style="display: flex; gap: 1rem;">
            <div style="flex: 1">
              <label>Price ($)</label>
              <input type="number" id="pPrice" required min="0.01" step="0.01" placeholder="99.99">
            </div>
            <div style="flex: 1">
              <label>Stock Quantity</label>
              <input type="number" id="pStock" required min="0" step="1" placeholder="50">
            </div>
          </div>

          <div>
            <label>Category</label>
            <select id="pCategory" required>
              <option value="Electronics">Electronics</option>
              <option value="Accessories">Accessories</option>
              <option value="Wearables">Wearables</option>
              <option value="Home">Home</option>
              <option value="Audio">Audio</option>
              <option value="Gaming">Gaming</option>
            </select>
          </div>

          <div>
            <label>Image URL</label>
            <input type="url" id="pImage" required placeholder="https://images.unsplash.com/...">
          </div>

          <div>
            <label>Description</label>
            <textarea id="pDesc" rows="4" required placeholder="Describe the product..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Publish Product</button>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script>
    document.getElementById('productForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newProduct = {
        name: document.getElementById('pName').value,
        price: parseFloat(document.getElementById('pPrice').value),
        stock: parseInt(document.getElementById('pStock').value),
        category: document.getElementById('pCategory').value,
        image: document.getElementById('pImage').value,
        description: document.getElementById('pDesc').value,
        sellerId: 2,
        rating: 0 // Default rating for new product
      };

      window.db.addProduct(newProduct);
      
      alert('Product added successfully!');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
