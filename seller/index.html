<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElixirTrade - Seller Dashboard</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .kpi-card {
      padding: 1.5rem;
      border-left: 4px solid var(--primary-start);
    }

    .kpi-title {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .kpi-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-heading);
    }

    .section-title {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 3rem;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.875rem;
    }

    tr:hover {
      background: rgba(255,255,255,0.02);
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav>
    <div class="container flex justify-between items-center">
      <a href="../index.html" class="nav-brand" style="background: var(--gradient-accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ElixirTrade | Seller</a>
      <div class="nav-actions">
        <a href="profile.html" style="display:flex; align-items:center; gap: 0.5rem; margin-right: 1rem; color: var(--text-body); text-decoration: none;">
          <img src="" id="navSellerAvatar" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
          <span id="navSellerName">Merchant</span>
        </a>
        <a href="../index.html" class="btn btn-outline">Exit</a>
      </div>
    </div>
  </nav>

  <main class="container" style="margin-top: 3rem;">
    <div class="dashboard-grid animate-fade-in">
      <div class="glass-panel kpi-card">
        <div class="kpi-title">Total Revenue</div>
        <div class="kpi-value" id="kpiRevenue">$0.00</div>
      </div>
      <div class="glass-panel kpi-card" style="border-left-color: var(--accent-start)">
        <div class="kpi-title">Active Orders</div>
        <div class="kpi-value" id="kpiOrders">0</div>
      </div>
      <div class="glass-panel kpi-card" style="border-left-color: var(--color-warning)">
        <div class="kpi-title">Low Stock Items</div>
        <div class="kpi-value" id="kpiStock">0</div>
      </div>
    </div>

    <div class="section-title animate-fade-in" style="animation-delay: 0.1s">
      <h2>Active Listings</h2>
      <a href="manage-product.html" class="btn btn-primary">+ New Product</a>
    </div>

    <div class="glass-panel animate-fade-in" style="animation-delay: 0.2s; padding: 0; overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryTable">
          <!-- Injected by JS -->
        </tbody>
      </table>
    </div>

    <div class="section-title animate-fade-in" style="animation-delay: 0.3s">
      <h2>Order Fulfillment</h2>
    </div>

    <div class="glass-panel animate-fade-in" style="animation-delay: 0.4s; padding: 0; overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="ordersTable">
          <!-- Injected by JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
