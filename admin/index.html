<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElixirTrade - Admin Operations</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .kpi-card {
      padding: 1.5rem;
      border-left: 4px solid var(--color-warning);
    }

    .kpi-title {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    .kpi-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-heading);
    }

    .section-title {
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 3rem;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      font-size: 0.875rem;
    }

    tr:hover {
      background: rgba(255,255,255,0.02);
    }

    .role-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .role-admin { background: rgba(245, 158, 11, 0.2); color: var(--color-warning); }
    .role-seller { background: rgba(99, 102, 241, 0.2); color: var(--primary-start); }
    .role-customer { background: rgba(6, 182, 212, 0.2); color: var(--accent-start); }

    .audit-log-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .audit-time {
      color: var(--text-muted);
      font-size: 0.875rem;
      width: 180px;
    }

    /* Platform Performance Mock Charts */
    .perf-chart-container {
      margin-bottom: 1.5rem;
    }
    .perf-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
    .perf-bar-bg {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      height: 12px;
      width: 100%;
      overflow: hidden;
    }
    .perf-bar-fill {
      height: 100%;
      background: var(--gradient-accent);
      border-radius: 8px;
      transition: width 0.5s ease;
    }
    .perf-bar-cpu { background: var(--color-danger); }
    .perf-bar-mem { background: var(--primary-start); }
    .perf-bar-net { background: var(--accent-start); }
  </style>
</head>
<body>

  <nav>
    <div class="container flex justify-between items-center">
      <a href="../index.html" class="nav-brand" style="color: var(--color-warning); -webkit-background-clip: unset; -webkit-text-fill-color: unset;">ElixirTrade | Admin</a>
      <div class="nav-actions">
        <span style="display:flex; align-items:center; gap: 0.5rem; margin-right: 1rem">
          <img src="" id="navAdminAvatar" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%;">
          <span id="navAdminName">SystemAdmin</span>
        </span>
        <a href="../index.html" class="btn btn-outline" style="border-color: var(--color-warning); color: var(--color-warning)">Exit</a>
      </div>
    </div>
  </nav>

  <main class="container" style="margin-top: 3rem;">
    <div class="dashboard-grid animate-fade-in">
      <div class="glass-panel kpi-card">
        <div class="kpi-title">Total GMV (Gross Merchandise Value)</div>
        <div class="kpi-value" id="kpiGMV">$0.00</div>
      </div>
      <div class="glass-panel kpi-card">
        <div class="kpi-title">Total Users</div>
        <div class="kpi-value" id="kpiUsers">0</div>
      </div>
      <div class="glass-panel kpi-card">
        <div class="kpi-title">Platform Logs</div>
        <div class="kpi-value" id="kpiLogs">0</div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 2rem;">
      <div style="display: flex; flex-direction: column; gap: 2rem;">
        <div>
          <h2 class="section-title animate-fade-in" style="animation-delay: 0.1s">User Management</h2>
          <div class="glass-panel animate-fade-in" style="animation-delay: 0.2s; padding: 0; overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>User</th>
                  <th>Role</th>
                  <th>Tokens</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="usersTable">
                <!-- Injected by JS -->
              </tbody>
            </table>
          </div>
        </div>

        <div>
          <h2 class="section-title animate-fade-in" style="animation-delay: 0.25s">Platform Performance (Simulated)</h2>
          <div class="glass-panel animate-fade-in" style="animation-delay: 0.3s">
            
            <div class="perf-chart-container">
              <div class="perf-label">
                <span>CPU Load</span>
                <span id="cpuVal">45%</span>
              </div>
              <div class="perf-bar-bg"><div class="perf-bar-fill perf-bar-cpu" id="cpuBar" style="width: 45%;"></div></div>
            </div>

            <div class="perf-chart-container">
              <div class="perf-label">
                <span>Memory Usage</span>
                <span id="memVal">62%</span>
              </div>
              <div class="perf-bar-bg"><div class="perf-bar-fill perf-bar-mem" id="memBar" style="width: 62%;"></div></div>
            </div>

            <div class="perf-chart-container" style="margin-bottom: 0;">
              <div class="perf-label">
                <span>Network I/O</span>
                <span id="netVal">28%</span>
              </div>
              <div class="perf-bar-bg"><div class="perf-bar-fill perf-bar-net" id="netBar" style="width: 28%;"></div></div>
            </div>

          </div>
        </div>
      </div>

      <div>
        <h2 class="section-title animate-fade-in" style="animation-delay: 0.3s">System Audit Log</h2>
        <div class="glass-panel animate-fade-in" style="animation-delay: 0.4s; height: 750px; overflow-y: auto;" id="auditLogs">
          <!-- Injected by JS -->
        </div>
      </div>
    </div>
  </main>

  <script src="../js/db.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
